# Publishes the site to GitHub Pages: https://svemula17.github.io/athidhi-website/
# Runs on every push to main, and every hour to pick up menu changes from Toast
# (hourly runs only redeploy when the menu actually changed).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

# One run at a time; a newer one waits for the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to save menu updates from Toast
      pages: write
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Read-only Toast access (Standard API). If Toast is unreachable the site still deploys
      # with the last menu it had; the run shows a warning.
      - name: Copy the menu from Toast
        id: toast
        continue-on-error: true
        run: node scripts/sync-toast-menu.mjs
        env:
          TOAST_CLIENT_ID: ${{ secrets.TOAST_CLIENT_ID }}
          TOAST_CLIENT_SECRET: ${{ secrets.TOAST_CLIENT_SECRET }}
          TOAST_RESTAURANT_GUID: ${{ secrets.TOAST_RESTAURANT_GUID }}
          TOAST_API_HOSTNAME: ${{ secrets.TOAST_API_HOSTNAME }}
      - name: Save menu changes to the repository
        if: steps.toast.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/toast-menu.json
          git commit -m "Update menu from Toast"
          # If main moved on during this run, the next hourly run saves it instead.
          git push origin HEAD:main || echo "::warning::Couldn't save the menu update this time; the next run will retry."
      - name: Decide whether to deploy
        id: decide
        run: echo "deploy=${{ github.event_name != 'schedule' || steps.toast.outputs.changed == 'true' }}" >> "$GITHUB_OUTPUT"

      - if: steps.decide.outputs.deploy == 'true'
        id: pages
        uses: actions/configure-pages@v6
      - if: steps.decide.outputs.deploy == 'true'
        run: npm ci
      # A github.io project site can't use robots.txt or a sitemap (crawlers only read them at the
      # domain root), and the static export can't build them, so they're left out of this build.
      - if: steps.decide.outputs.deploy == 'true'
        run: rm src/app/robots.ts src/app/sitemap.ts
      - if: steps.decide.outputs.deploy == 'true'
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - if: steps.decide.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
