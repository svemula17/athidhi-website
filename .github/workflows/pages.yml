# Publishes the site: the preview on GitHub Pages (https://svemula17.github.io/athidhi-website/,
# kept out of search results) and, once the IONOS secrets are added, the official site on IONOS
# web hosting (athidhinj.com). Runs on every push to main, and every hour to pick up menu changes
# from Toast (hourly runs only redeploy when the menu actually changed).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      menu_only:
        description: Only redeploy if the menu on Toast changed
        type: boolean
        default: false
  # GitHub skips many of these, so once the site is on IONOS, a timer there (ionos/menu-sync.sh)
  # also starts this workflow every hour, as a menu-only run.
  schedule:
    - cron: "17 * * * *"

# One run at a time; a newer one waits for the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to save menu updates from Toast
      pages: write
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    env:
      # The official site is uploaded to IONOS once its SFTP login is saved (README: "Before going live").
      HAS_IONOS: ${{ secrets.IONOS_SFTP_HOST != '' && secrets.IONOS_SFTP_USER != '' && secrets.IONOS_SFTP_PASSWORD != '' }}
      # The hourly menu sync timer on IONOS needs this GitHub token too (README).
      HAS_MENU_SYNC_TOKEN: ${{ secrets.MENU_SYNC_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Read-only Toast access (Standard API). If Toast is unreachable the site still deploys
      # with the last menu it had; the run shows a warning.
      - name: Copy the menu from Toast
        id: toast
        continue-on-error: true
        run: node scripts/sync-toast-menu.mjs
        env:
          TOAST_CLIENT_ID: ${{ secrets.TOAST_CLIENT_ID }}
          TOAST_CLIENT_SECRET: ${{ secrets.TOAST_CLIENT_SECRET }}
          TOAST_RESTAURANT_GUID: ${{ secrets.TOAST_RESTAURANT_GUID }}
          TOAST_API_HOSTNAME: ${{ secrets.TOAST_API_HOSTNAME }}
      - name: Save menu changes to the repository
        if: steps.toast.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/toast-menu.json
          git commit -m "Update menu from Toast"
          # If main moved on during this run, the next hourly run saves it instead.
          git push origin HEAD:main || echo "::warning::Couldn't save the menu update this time; the next run will retry."
      # Pushes and manual runs always deploy; timed (menu-only) runs only when the menu changed.
      - name: Decide whether to deploy
        id: decide
        env:
          FULL: ${{ github.event_name != 'schedule' && github.event.inputs.menu_only != 'true' }}
          CHANGED: ${{ steps.toast.outputs.changed == 'true' }}
        run: |
          if [ "$FULL" = true ] || [ "$CHANGED" = true ]; then deploy=true; else deploy=false; fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Deploy: $deploy (full run: $FULL, menu changed: $CHANGED)"

      - if: steps.decide.outputs.deploy == 'true'
        id: pages
        uses: actions/configure-pages@v6
      - if: steps.decide.outputs.deploy == 'true'
        run: npm ci
      # The static export only writes robots.txt and sitemap.xml when they're marked static, a
      # setting the normal build (Cache Components) refuses, so it's added for this build only.
      - if: steps.decide.outputs.deploy == 'true'
        run: |
          for file in src/app/robots.ts src/app/sitemap.ts; do
            printf '\nexport const dynamic = "force-static";\n' >> "$file"
          done
      - name: Build the preview
        if: steps.decide.outputs.deploy == 'true'
        run: |
          npm run build
          node scripts/image-variants.mjs
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # The github.io preview stays out of search results; only athidhinj.com should be indexed.
          NEXT_PUBLIC_NOINDEX: "true"
      - if: steps.decide.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

      # The official site: the same static build at the domain's root, open to search engines, with
      # the web server settings IONOS needs (scripts/ionos-htaccess.mjs). Files get times from their
      # contents, so the upload only sends what changed (scripts/stable-file-times.mjs).
      - name: Build the official site
        if: steps.decide.outputs.deploy == 'true' && env.HAS_IONOS == 'true'
        run: |
          npm run build
          node scripts/image-variants.mjs
          node scripts/ionos-htaccess.mjs
          node scripts/stable-file-times.mjs
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://athidhinj.com' }}
      # Without the repository variable IONOS_KNOWN_HOSTS, the server's key is trusted on first use
      # and printed, so it can be saved there.
      - name: Connect to IONOS
        if: steps.decide.outputs.deploy == 'true' && env.HAS_IONOS == 'true'
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          KNOWN_HOSTS: ${{ vars.IONOS_KNOWN_HOSTS }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp > /dev/null
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 20 "$HOST" 2> /dev/null > ~/.ssh/known_hosts
            echo "::notice::Trusted IONOS's server key on first use. To pin it, save the lines printed below as the repository variable IONOS_KNOWN_HOSTS."
            cat ~/.ssh/known_hosts
          fi
      # Two passes, so a visitor never gets a page whose files aren't there yet: new and changed
      # files first, then the pages and server settings, then files the site no longer has are removed.
      # --upload-older is required: file times come from contents (scripts/stable-file-times.mjs), so a
      # changed file can get an earlier time than the copy on the server, and lftp skips those by default.
      - name: Upload the official site to IONOS
        if: steps.decide.outputs.deploy == 'true' && env.HAS_IONOS == 'true'
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          # The webspace folder the domain points to (IONOS → Domains → athidhinj.com → Destination).
          SITE_DIR: ${{ vars.IONOS_SITE_DIR || 'athidhinj' }}
        run: |
          cat > "$RUNNER_TEMP/upload.lftp" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          open --env-password -u "$SFTP_USER" "sftp://$HOST"
          mkdir -p -f "$SITE_DIR"
          mirror --reverse --overwrite --upload-older --parallel=4 --verbose --exclude-glob '*.html' --exclude-glob '*.txt' --exclude-glob .htaccess out "$SITE_DIR"
          mirror --reverse --overwrite --upload-older --parallel=4 --verbose --delete --exclude-glob .well-known/ out "$SITE_DIR"
          EOF
          lftp -f "$RUNNER_TEMP/upload.lftp"

      # The files for the hourly timer on IONOS that starts this workflow as a menu-only run
      # (ionos/menu-sync.sh, run by a cron job in IONOS → Hosting → Cron jobs), in a webspace folder
      # no website points to. Updated on pushes and full manual runs; a problem here leaves a
      # warning but doesn't hold back the site.
      - name: Put the hourly menu sync timer on IONOS
        if: steps.decide.outputs.full == 'true' && env.HAS_IONOS == 'true' && env.HAS_MENU_SYNC_TOKEN == 'true'
        continue-on-error: true
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          MENU_SYNC_TOKEN: ${{ secrets.MENU_SYNC_TOKEN }}
        run: |
          umask 077
          timer="$RUNNER_TEMP/athidhi-cron"
          trap 'rm -rf "$timer"' EXIT
          mkdir -p "$timer"
          cp ionos/menu-sync.sh "$timer/"
          printf '%s\n' "$GITHUB_REPOSITORY" > "$timer/repository"
          printf 'Authorization: Bearer %s\n' "$MENU_SYNC_TOKEN" > "$timer/auth-header"
          printf 'Require all denied\n' > "$timer/.htaccess"
          cat > "$RUNNER_TEMP/timer.lftp" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 3
          open --env-password -u "$SFTP_USER" "sftp://$HOST"
          mirror --reverse --overwrite --verbose "$timer" athidhi-cron
          chmod 700 athidhi-cron
          chmod 700 athidhi-cron/menu-sync.sh
          chmod 600 athidhi-cron/repository athidhi-cron/auth-header athidhi-cron/.htaccess
          EOF
          lftp -f "$RUNNER_TEMP/timer.lftp"

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
