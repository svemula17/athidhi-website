# Publishes the site: the preview on GitHub Pages (https://svemula17.github.io/athidhi-website/,
# kept out of search results) and, once the Cloudflare secrets are added, the official site on
# Cloudflare Pages (athidhinj.com). Runs on every push to main, and every hour to pick up menu
# changes from Toast (hourly runs only redeploy when the menu actually changed).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      menu_only:
        description: Only redeploy if the menu on Toast changed
        type: boolean
        default: false
  # GitHub skips many of these, so once it's set up, a Cloudflare timer (workers/menu-sync) also
  # starts this workflow every hour, as a menu-only run.
  schedule:
    - cron: "17 * * * *"

# One run at a time; a newer one waits for the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to save menu updates from Toast
      pages: write
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    env:
      # The official site deploys to Cloudflare Pages once both secrets exist (README: "Before going live").
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      # The hourly menu sync timer on Cloudflare needs this GitHub token too (README).
      HAS_MENU_SYNC_TOKEN: ${{ secrets.MENU_SYNC_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Read-only Toast access (Standard API). If Toast is unreachable the site still deploys
      # with the last menu it had; the run shows a warning.
      - name: Copy the menu from Toast
        id: toast
        continue-on-error: true
        run: node scripts/sync-toast-menu.mjs
        env:
          TOAST_CLIENT_ID: ${{ secrets.TOAST_CLIENT_ID }}
          TOAST_CLIENT_SECRET: ${{ secrets.TOAST_CLIENT_SECRET }}
          TOAST_RESTAURANT_GUID: ${{ secrets.TOAST_RESTAURANT_GUID }}
          TOAST_API_HOSTNAME: ${{ secrets.TOAST_API_HOSTNAME }}
      - name: Save menu changes to the repository
        if: steps.toast.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/toast-menu.json
          git commit -m "Update menu from Toast"
          # If main moved on during this run, the next hourly run saves it instead.
          git push origin HEAD:main || echo "::warning::Couldn't save the menu update this time; the next run will retry."
      # Pushes and manual runs always deploy; timed (menu-only) runs only when the menu changed.
      - name: Decide whether to deploy
        id: decide
        env:
          FULL: ${{ github.event_name != 'schedule' && github.event.inputs.menu_only != 'true' }}
          CHANGED: ${{ steps.toast.outputs.changed == 'true' }}
        run: |
          if [ "$FULL" = true ] || [ "$CHANGED" = true ]; then deploy=true; else deploy=false; fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Deploy: $deploy (full run: $FULL, menu changed: $CHANGED)"

      - if: steps.decide.outputs.deploy == 'true'
        id: pages
        uses: actions/configure-pages@v6
      - if: steps.decide.outputs.deploy == 'true'
        run: npm ci
      # The static export only writes robots.txt and sitemap.xml when they're marked static, a
      # setting the normal build (Cache Components) refuses, so it's added for this build only.
      - if: steps.decide.outputs.deploy == 'true'
        run: |
          for file in src/app/robots.ts src/app/sitemap.ts; do
            printf '\nexport const dynamic = "force-static";\n' >> "$file"
          done
      - name: Build the preview
        if: steps.decide.outputs.deploy == 'true'
        run: |
          npm run build
          node scripts/image-variants.mjs
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # The github.io preview stays out of search results; only athidhinj.com should be indexed.
          NEXT_PUBLIC_NOINDEX: "true"
      - if: steps.decide.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

      # The official site: the same static build at the domain's root, open to search engines,
      # with security and cache headers for Cloudflare (scripts/cloudflare-headers.mjs).
      - name: Build the official site
        if: steps.decide.outputs.deploy == 'true' && env.HAS_CLOUDFLARE == 'true'
        run: |
          npm run build
          node scripts/image-variants.mjs
          node scripts/cloudflare-headers.mjs
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://athidhinj.com' }}
      - name: Deploy the official site to Cloudflare Pages
        if: steps.decide.outputs.deploy == 'true' && env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'athidhi' }}
        run: |
          # Creates the Cloudflare Pages project on the first run; afterwards it already exists.
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main || true
          npx --yes wrangler@4 pages deploy out --project-name="$PROJECT" --branch=main --commit-dirty=true

      # The hourly timer that starts this workflow as a menu-only run (workers/menu-sync). Set up on
      # pushes and full manual runs; a problem here leaves a warning but doesn't hold back the site.
      - name: Set up the hourly menu sync timer on Cloudflare
        if: steps.decide.outputs.full == 'true' && env.HAS_CLOUDFLARE == 'true' && env.HAS_MENU_SYNC_TOKEN == 'true'
        continue-on-error: true
        working-directory: workers/menu-sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MENU_SYNC_TOKEN: ${{ secrets.MENU_SYNC_TOKEN }}
        run: |
          npx --yes wrangler@4 deploy --var "REPOSITORY:$GITHUB_REPOSITORY"
          printf '%s' "$MENU_SYNC_TOKEN" | npx --yes wrangler@4 secret put MENU_SYNC_TOKEN

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
