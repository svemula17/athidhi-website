# One-off: copies the photos and the catering PDF from the old site (athidi.vercel.app) into
# public/ and switches the site to them (scripts/download-assets.mjs). Runs when this file is
# pushed, or from the Actions tab. Delete this file once the copies are saved.
name: Copy photos from the old site

on:
  push:
    branches: [main]
    paths: [.github/workflows/self-host-photos.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/download-assets.mjs
      - name: Save the copies to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public src/lib/assets.ts
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Self-host the photos from the old site"
          git pull --rebase origin main
          git push origin HEAD:main
