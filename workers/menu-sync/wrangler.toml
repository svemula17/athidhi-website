# Hourly Cloudflare timer that starts the Toast menu sync on GitHub (index.js). The deploy workflow
# (.github/workflows/pages.yml) sets it up once the Cloudflare and MENU_SYNC_TOKEN secrets exist.
name = "athidhi-menu-sync"
main = "index.js"
compatibility_date = "2026-11-01"

# No web address: the Worker only runs on its schedule.
workers_dev = false
preview_urls = false

[vars]
# The deploy workflow passes the repository it runs in.
REPOSITORY = "svemula17/athidhi-website"

[triggers]
crons = ["17 * * * *"]
